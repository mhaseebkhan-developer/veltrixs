<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Veltrixs administration</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:20px}textarea,pre{width:100%;white-space:pre-wrap;overflow-wrap:anywhere}button{padding:10px}</style><h1>Veltrixs administration</h1><h2>Pricing packages</h2><textarea id="pricing" rows="20" aria-label="Pricing JSON"></textarea><button id="save">Save pricing</button><p id="status" role="status"></p><h2>Inquiries</h2><pre id="inquiries"></pre><script>const p=document.querySelector('#pricing'),s=document.querySelector('#status');fetch('/api/pricing').then(r=>r.json()).then(x=>p.value=JSON.stringify(x,null,2));fetch('/api/admin/inquiries').then(r=>r.json()).then(x=>document.querySelector('#inquiries').textContent=JSON.stringify(x,null,2));document.querySelector('#save').onclick=async()=>{try{const r=await fetch('/api/admin/pricing',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(JSON.parse(p.value))});s.textContent=r.ok?'Saved':'Save failed'}catch{s.textContent='Invalid data or network error'}};</script></html>
